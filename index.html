<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freetown PT Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Header styling */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #006241; /* deep green */
      padding: 10px 15px;
      color: white;
    }

    .header-left .app-title {
      font-size: 18px;
      font-weight: bold;
      line-height: 1.2;
    }

    .header-right {
      display: flex;
      align-items: center;
    }

    .header-right button {
      margin-left: 8px;
      background-color: #008C45; /* lighter green */
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .header-right button:hover {
      background-color: #006f36;
    }

    #map {
      height: calc(100vh - 60px); /* subtract header height */
      width: 100%;
    }

    #footer {
      background: #004d33;
      color: white;
      text-align: center;
      padding: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div id="header">
    <div class="header-left">
      <span class="app-title">🚖 Freetown PT Tracker 🇸🇱</span>
    </div>
    <div class="header-right">
      <button id="locateBtn">📍 My Location</button>
      <button id="clearBtn">🧹 Clear</button>
      <button id="menuBtn">☰ Menu</button>
    </div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Footer -->
  <div id="footer">
    <span id="clock"></span>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Map setup
    const map = L.map("map").setView([8.4657, -13.2317], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
    }).addTo(map);

    // Example marker
    L.marker([8.4657, -13.2317]).addTo(map)
      .bindPopup("Welcome to Freetown!");
  </script>
</body>
</html>
